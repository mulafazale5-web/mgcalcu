<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;

       }
       .container{
        background-color: none;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
       }
       .calculator{
        background-color: rgb(31, 34, 34);
        padding: 20px;
        border-radius: 10px;
       }
       .calculator form input{
        border: 0;
        outline: 0;
        height: 60px;
        width: 60px;
        border-radius: 10px;
        font-size: 20px;
        color: rgb(255, 255, 255);
        cursor: pointer;
        box-shadow: -8px -8px 15px rgb(255, 255, 255, 0.1),5px 5px 15px rgb(0, 0, 0,0.2);
        margin: 10px;
        background: transparent;
       }
     
      form .display{
        display: flex;
        justify-content: flex-end;
        margin: 20px 0;
      }
      form .display input{
        flex: 1;
        box-shadow: none;
        text-align: right;
        font-size: 45px;
      }
      form div .equal{
        width: 145px;
        color: rgb(255, 255, 255);
    
      }
     
    </style>
</head>
<body>

    <div class="container">
        <div class="calculator">
            <form action="">
                <div class="display">
                    <input type="text" name="display">
                </div>
                <div>
                    <input type="button" value="AC" onclick="display.value =''">
                     <input type="button" value="Del" onclick="display.value = display.value.toString().slice(0,-1)">
                      <input type="button" value="/" onclick="display.value += '/'">
                       <input type="button" value="." onclick="display.value += '.'">
                </div>
                <div>
                    <input type="button" value="7" onclick="display.value += '7'">
                    <input type="button" value="8" onclick="display.value += '8'">
                    <input type="button" value="9" onclick="display.value += '9'">
                    <input type="button" value="*" onclick="display.value += '*'">
                </div>
                <div>  <input type="button" value="4" onclick="display.value += '4'">
                     <input type="button" value="5" onclick="display.value += '5'">
                     <input type="button" value="6" onclick="display.value += '6'">
                       <input type="button" value="-" onclick="display.value += '-'">
                </div>
                <div>
                    <input type="button" value="1" onclick="display.value += '1' ">
                     <input type="button" value="2" onclick="display.value += '2'">
                      <input type="button" value="3" onclick="display.value += '3'">
                       <input type="button" value="+" onclick="display.value += '+'">
                </div>
                  <div>
                    <input type="button" value="00" onclick="display.value += '00'">
                     <input type="button" value="0" onclick="display.value += '0'">
                      <input type="button" value="=" class="equal" onclick="display.value = eval(display.value)
                      ">
                       
                </div>
            </form>
        </div>
    </div>
   <script >
   
   </script>
</body>
</html>
